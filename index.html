<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Meu App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background-color: #f6f8fa;
            color: #24292f;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 360px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-header .logo-mark {
            width: 40px;
            height: 40px;
            background: #0969da;
            color: #fff;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .brand-header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #1f2328;
            letter-spacing: -0.3px;
        }

        .login-box {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 24px;
            box-shadow: 0 3px 6px rgba(140, 149, 159, 0.15);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #1f2328;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label-row a {
            font-size: 12px;
            color: #0969da;
            text-decoration: none;
        }

        .label-row a:hover {
            text-decoration: underline;
        }

        .form-control {
            width: 100%;
            padding: 7px 12px;
            font-size: 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background-color: #f6f8fa;
            color: #1f2328;
            outline: none;
            transition: 0.2s ease;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: #0969da;
            box-shadow: 0 0 0 3px rgba(9, 105, 218, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #ffffff;
            background-color: #2da44e;
            border: 1px solid rgba(27, 31, 36, 0.15);
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #2c974b;
        }

        .btn-primary:active {
            background-color: #298e46;
        }

        .create-account-box {
            margin-top: 16px;
            padding: 16px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            background: #ffffff;
        }

        .create-account-box a {
            color: #0969da;
            text-decoration: none;
            font-weight: 500;
        }

        .create-account-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="brand-header">
            <div class="logo-mark">A</div>
            <h1>Acessar a conta</h1>
        </div>

        <div class="login-box">
            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="email">Endereço de e-mail</label>
                    <input type="email" id="email" name="email" class="form-control" required autofocus>
                </div>

                <div class="form-group">
                    <div class="label-row">
                        <label for="password">Senha</label>
                        <a href="#">Esqueceu?</a>
                    </div>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>

        <div class="create-account-box">
            Novo por aqui? <a href="#">Criar uma conta</a>.
        </div>
    </div>

</body>
</html>
